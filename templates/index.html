<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Aegis Engine 监控终端</title>
    <style>
        body { background-color: #0b0f19; color: #a9b7c6; font-family: 'Consolas', 'Courier New', monospace; padding: 2rem; margin: 0; }
        .dashboard { max-width: 900px; margin: 0 auto; }
        h1 { color: #00ff41; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .card { background: #151a25; border: 1px solid #2a3345; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .input-group { display: flex; gap: 15px; margin-bottom: 20px; }
        input { background: #0b0f19; border: 1px solid #00ff41; color: #00ff41; padding: 10px; border-radius: 4px; flex: 1; text-align: center; font-size: 1.1rem; outline: none; }
        button { background: #00ff41; color: #0b0f19; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1.1rem; transition: all 0.2s; width: 100%; }
        button:hover { background: #00cc33; box-shadow: 0 0 15px #00ff41; }
        .terminal { background: #000; border: 1px solid #333; padding: 15px; height: 200px; overflow-y: auto; border-radius: 4px; }
        .log { margin: 5px 0; color: #ccc; }
        .sys-ok { color: #00ff41; }
        .sys-error { color: #ff5f56; }
        .result-card { border-left: 5px solid #00ff41; font-size: 1.5rem; }
        button:disabled { cursor: wait; opacity: 0.65; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>🛡️ Aegis Sandbox & AI Engine</h1>
        
        <div class="card">
            <h3>[数据注入] 动态特征输入 (X)</h3>
            <div class="input-group">
                <input type="number" id="f1" value="1.0" step="0.1" min="-1000000" max="1000000" aria-label="特征 1">
                <input type="number" id="f2" value="-2.0" step="0.1" min="-1000000" max="1000000" aria-label="特征 2">
                <input type="number" id="f3" value="3.0" step="0.1" min="-1000000" max="1000000" aria-label="特征 3">
            </div>
            <button id="launch-button" onclick="launchEngine()">▶ 发起全栈评测请求</button>
        </div>

        <div class="card">
            <h3>[沙盒监控] Seccomp 执行日志</h3>
            <div class="terminal" id="terminal" aria-live="polite">
                <div class="log sys-ok">等待系统接入...</div>
            </div>
        </div>

        <div class="card result-card" id="result-box" style="display: none;">
            <strong>执行状态: </strong> <span id="verdict" style="color:#00ff41;"></span>
            <div style="font-size: 1rem; margin-top: 10px;">引擎结果: <span id="output"></span></div>
            <div style="font-size: 1rem; color: #888; margin-top: 10px;">处理耗时: <span id="time"></span> ms</div>
        </div>
    </div>

    <script>
        function appendLog(message, className = 'log') {
            const term = document.getElementById('terminal');
            const line = document.createElement('div');
            line.className = className;
            line.textContent = message;
            term.appendChild(line);
        }

        async function launchEngine() {
            const features = ['f1', 'f2', 'f3'].map(id => Number(document.getElementById(id).value));
            const term = document.getElementById('terminal');
            const button = document.getElementById('launch-button');
            const resultBox = document.getElementById('result-box');
            const verdict = document.getElementById('verdict');

            term.replaceChildren();
            appendLog('🚀 发起 JSON 请求...');
            resultBox.style.display = 'none';

            if (!features.every(Number.isFinite)) {
                appendLog('❌ 三个特征都必须是有效数值', 'log sys-error');
                return;
            }

            button.disabled = true;
            button.textContent = '执行中...';
            const controller = new AbortController();
            const clientTimeout = setTimeout(() => controller.abort(), 3000);

            try {
                const res = await fetch('/api/v1/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({features}),
                    signal: controller.signal
                });
                const data = await res.json();

                term.replaceChildren();
                (data.sandbox_logs || []).forEach(log => appendLog(log, 'log sys-ok'));
                resultBox.style.display = 'block';
                document.getElementById('time').textContent = data.execution?.wall_ms ?? '-';

                if (!res.ok) {
                    verdict.textContent = data.error?.code || `HTTP_${res.status}`;
                    verdict.style.color = '#ff5f56';
                    document.getElementById('output').textContent = data.error?.message || '请求失败';
                    appendLog(`❌ ${data.error?.message || '请求失败'}`, 'log sys-error');
                    return;
                }

                verdict.textContent = 'OK';
                verdict.style.color = '#00ff41';
                document.getElementById('output').textContent = JSON.stringify(data.result.prediction);
            } catch (e) {
                resultBox.style.display = 'block';
                verdict.textContent = 'CLIENT_ERROR';
                verdict.style.color = '#ff5f56';
                document.getElementById('output').textContent = e.name === 'AbortError' ? '客户端等待超时' : e.message;
                appendLog(`❌ 请求失败: ${e.message}`, 'log sys-error');
            } finally {
                clearTimeout(clientTimeout);
                button.disabled = false;
                button.textContent = '▶ 发起全栈评测请求';
            }
        }
    </script>
</body>
</html>
